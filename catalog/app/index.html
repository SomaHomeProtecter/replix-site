<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 대상 서버는 이 태그 한 곳에서 정한다(랜딩 docs/index.html 과 같은 방식).
         2026-10-01 운영 전환(HP-422 ④): 개발 서버에서 운영 서버로. ⚠ auth-base 와 반드시 함께 바꾼다 — 백엔드는
         환경마다 자기 Keycloak 발급자만 믿어서, 한쪽만 바꾸면 로그인 사용자의 댓글·별점 요청이 401 이 된다. -->
    <meta name="api-base" content="https://api.replix.tv" />
    <!-- 로그인(작품 댓글·별점 쓰기용, HP-124). 확장과 같은 Keycloak realm·클라이언트(replix-web)를 쓴다 —
         같은 계정으로 채팅과 댓글이 이어지고 백엔드의 azp 검증도 그대로 통과한다.
         Keycloak 클라이언트 replix-web 의 Valid redirect URIs 에 https://replix.tv/catalog/* 등록 완료(HP-418, 운영 2026-09-24 확인). -->
    <meta name="auth-base" content="https://auth.replix.tv" />
    <meta name="auth-realm" content="replix" />
    <meta name="auth-client" content="replix-web" />
    <title>Replix 작품 탐색</title>
    <meta name="description" content="넷플릭스를 보는 사람들의 채팅이 몰린 회차와 순간을 찾아 그 시각부터 봅니다." />
    <!-- 링크 미리보기·아이콘(HP-478) — 랜딩(docs/index.html)과 같은 로고 이미지·아이콘을 쓴다(작품 이미지는 쓰지 않는다, CLAUDE.md §7).
         아이콘은 사이트 루트(docs/)에 있어 빌드가 건드리지 않고 그대로 둔다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Replix" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://replix.tv/catalog/" />
    <meta property="og:title" content="Replix 작품 탐색" />
    <meta property="og:description" content="넷플릭스를 보는 사람들의 채팅이 몰린 회차와 순간을 찾아 그 시각부터 봅니다." />
    <meta property="og:image" content="https://replix.tv/assets/og/replix-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Replix" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#faf9f9" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
