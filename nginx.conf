# 랜딩 정적 서빙(HP-87). 컨테이너 안에서만 쓰이는 설정이라 TLS·리다이렉트는 없다 —
# HTTPS 종료와 http→https 리다이렉트는 앞단 ALB(Ingress 애노테이션)가 한다.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # dev 표면은 검색에 노출되지 않아야 한다. index.html 의 meta robots 와 이중으로 건다 —
    # 메타 태그는 HTML 에만 붙지만 이 헤더는 이미지·CSS 를 포함한 모든 응답에 붙는다.
    # ⚠️ 이 설정으로 replix.tv 운영을 서빙하게 되면 이 줄을 반드시 지울 것(색인 자체가 막힌다).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 정적 파일뿐이라 압축 이득이 큰 것은 텍스트 계열이다. jpg 는 이미 압축돼 있어 제외.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # k8s·ALB 헬스체크 전용. 정적 파일이라 200이면 곧 서빙 가능이다.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 해시 파일명이 없으므로(번들러 미도입) 이미지에 영구 캐시를 걸면 교체가 반영되지 않는다.
    # 하루면 dev 검토 주기에 맞고, 갱신도 하루 안에 따라온다.
    location ~* \.(jpg|png|svg|ico)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # CSS·JS 는 문구 수정과 함께 자주 바뀌므로 매번 서버에 물어보게 한다(304 면 본문은 안 온다).
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
