<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Replix 익스텐션 화면 예시</title>
<!-- 랜딩(index.html)이 iframe 으로 넣는 익스텐션 화면이다(HP-677). 익스텐션의 실제 화면을 구워 둔 것 — 마크업은 film-<장면>.js,
     스타일은 panel.css(익스텐션 styles.css 에서 이 장면들이 쓰는 규칙만 남긴 것), 글꼴은 fonts/(익스텐션의 Replix Sans 에서 쓰는 글자만).
     셋 다 scripts/ext-panel/bake.mjs 가 만든다 — 손으로 고치지 않는다(notes/ext-panel.md). 장면은 주소의 # 뒤 이름: hero · friends · discord · solo · live.
     사람·작품·대화는 지어낸 예시이고, 이 페이지는 어디로도 요청을 보내지 않는다. -->
<link rel="stylesheet" href="panel.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #replix-root #replix-panel { width: 100vw !important; }
  #replix-root * { caret-color: transparent !important; }
  /* 장면이 바뀔 때 새로 생긴 줄·화면이 살짝 떠오른다(panel.js 가 표식을 잠깐 단다) */
  @keyframes rxb-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  [data-rxb-new] { animation: rxb-in .28s cubic-bezier(.2, .8, .2, 1) both; }
  @media (prefers-reduced-motion: reduce) { [data-rxb-new] { animation: none; } }
</style>
<div id="replix-root" class="replix-open"></div>
<script src="panel.js"></script>
</html>
