<!doctype html>
<!-- 같이보기 타이머(HP-757 방송 화면 오버레이 → HP-791 여러 버전) — https://replix.tv/overlay#t=<오버레이 토큰>[&v=corner|bar|clock|chip][&env=dev]
     역할: 스트리머 방의 방송인이 OBS 브라우저 소스로 띄운다. 익스텐션 없이 방송만 따라 보는 시청자도 방장 위치를 알게, 보는 플랫폼·작품명·
     회차와 방장 위치·상태를 카드 하나로 보여 준다. 방송과 함께 늦게 나가므로 '방송 기준 시각'이 된다.
     · 버전(v) 네 가지(2026-11-03 조현빈 결정, 시안 GiLmzKjiZQ7GYKTBGWSNVU) — corner 코너 카드(기본) · bar 플레이어 바 · clock 큰 시계 ·
       chip 미니 칩. 없거나 모르는 값이면 corner. 권장 소스 크기는 VERSION_SOURCE 표(익스텐션 방 관리가 같은 값을 안내한다).
     · 배경은 칠하지 않는다(OBS 투명 합성) — 카드만 그린다. 위치·크기는 방송인이 OBS 에서 옮기고 늘린다. 배율 옵션은 두지 않고, 모든 치수를
       rem(= 권장 소스 크기에서 1px)으로 써서 소스 크기(뷰포트)에 맞춰 다시 그린다 — OBS 에서 소스 너비·높이를 바꾸면 이미지를 늘리지 않고
       글자가 선명하게 커진다. 가로세로 비가 다르면 작은 쪽에 맞춘다(카드가 잘리지 않게). 익스텐션 방 관리의 작은 미리보기도 같은 규칙으로 줄어든다.
     · 토큰은 해시(#)로만 받는다 — GitHub Pages 서버·리퍼러로 가지 않는다. 묻는 곳은 우리 API(공개 stream-overlay, Replix-be HP-757)뿐이다.
     · 2초마다 묻고, 그 사이는 받은 위치에 흐른 시간 × 재생 속도를 더해 초를 흘린다. 서버가 응답 시각의 위치를 실어 주므로 방송 PC
       시계가 어긋나도 틀어지지 않는다. 30초 넘게 답을 못 받으면 낡은 값을 띄우지 않게 감춘다.
     · 토큰이 없거나 링크가 꺼졌으면(404 — 꺼짐·다시 만듦·방장 바뀜) 아무것도 그리지 않는다. 방송 화면에 오류 글을 띄우지 않으려는 것이다.
       5초마다 다시 묻는다.
     · 싣는 것은 식별 정보(플랫폼·작품명·시즌/회차 번호 — 법규 트리거 ⑥, 회차 제목·포스터·스틸컷·줄거리·플랫폼 로고 없이 플랫폼은 글자로)와
       방장 위치·상태, 그리고 남은 시간이다. 서버 문자열은 textContent 로만 넣는다.
     · 남은 시간 '-55:08'(2026-11-02 김지호 결정) — 서버가 회차 길이(durationSec)를 실었을 때만, 회차 끝에서는 뺀다. 길이는 방장 플레이어가
       보낸 것을 서버가 1시간 수명의 Redis 에만 두는 규칙 문서 'B2 예외'다(워크스페이스 docs/legal-compliance-dev-rules.md, Replix-be HP-757).
       진행 막대도 같은 길이로만 센다(길이를 모르면 막대를 감춘다).
     · env=dev 면 개발 서버(api.replix-dev.site)에 묻는다 — 익스텐션 개발 빌드가 만든 링크다. 다른 값은 받지 않는다(아무 주소나 묻지 않게).
     · 상태 그림·획 가운데 맞춤(HP-817, 2026-11-05 조현빈 결정) — 멈춤 ‖·재생 ● 는 글자가 아니라 인라인 SVG 도형이다(글꼴마다 굵기·높이가 달라진다).
       가운데로 맞춘 줄(미니 칩·코너 카드 윗줄·플레이어 바·큰 시계 윗줄과 아랫줄)과 작은 카드(플랫폼·상태 칩)의 글자는 줄 상자가 아니라
       글자 획이 가운데에 오게, 이 PC 의 글꼴로 획을 재서 옮긴다(alignInk). CSS text-box 는 OBS 32(Chromium 127)에 없어 쓰지 않는다.
       기준선으로 맞춘 코너 카드 시각 줄과 위아래로 쌓는 큰 시계 가운데는 옮기지 않는다.
     외부 리소스 0, 계측 없음 — 단일 파일. 검사 = scripts/test-overlay.mjs -->
<html lang="ko" class="v-corner">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 토큰이 실린 주소가 검색에 잡히지 않게(토큰은 해시라 서버에는 가지 않는다). -->
  <meta name="robots" content="noindex">
  <!-- 오버레이를 묻는 곳 — 운영 BE. 링크에 env=dev 가 있으면 개발 서버를 묻는다. -->
  <meta name="api-base" content="https://api.replix.tv">
  <title>Replix 같이보기 타이머</title>
  <style>
    /* OBS 브라우저 소스는 배경을 투명하게 합성한다 — 페이지 배경을 칠하지 않는다. */
    html, body { margin: 0; background: transparent; }
    /* 1rem = 권장 소스 크기에서의 1px. 소스가 그보다 크거나 작으면 가로·세로 가운데 작은 쪽 비율로 다시 그린다(VERSION_SOURCE 와 같은 값). */
    html.v-corner { font-size: min(calc(100vw / 480), calc(100vh / 200)); }
    html.v-bar { font-size: min(calc(100vw / 1320), calc(100vh / 120)); }
    html.v-clock { font-size: min(calc(100vw / 440), calc(100vh / 360)); }
    html.v-chip { font-size: min(calc(100vw / 360), calc(100vh / 96)); }
    body { overflow: hidden; font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif; }
    .ov[hidden], .ov [hidden] { display: none !important; }
    .ov {
      position: absolute; left: 20rem; top: 20rem; box-sizing: border-box;
      color: #fff; background: rgba(10, 10, 14, 0.85); white-space: nowrap;
      /* 숫자 폭만 고정한다(tabular-nums) — 초가 바뀔 때 카드가 흔들리지 않게. 고정폭 글꼴은 ':' 앞뒤가 벌어져 쓰지 않는다. */
      font-variant-numeric: tabular-nums;
    }
    .pf { flex: none; display: inline-flex; align-items: center; font-size: 0.73em; font-weight: 700; letter-spacing: 0.04em; padding: 0.1em 0.55em; border-radius: 0.3em; background: rgba(255, 255, 255, 0.13); color: #dcdce2; }
    .ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .ep { flex: none; font-weight: 700; color: #b4b4be; }
    .now { font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
    .dim { font-weight: 700; color: #b4b4be; }
    .note { font-weight: 500; color: #b4b4be; }
    .chip { flex: none; display: inline-flex; align-items: center; gap: 0.38em; font-weight: 700; border-radius: 999rem; background: rgba(255, 255, 255, 0.14); color: #e6e6ec; }
    .bar { overflow: hidden; background: rgba(255, 255, 255, 0.16); }
    .bar i { display: block; height: 100%; width: var(--p, 0%); background: rgb(61, 220, 151); }
    /* 상태 — 멈춤·시작 전은 숫자를 낮추고, 광고 대기는 주황(칩·막대 줄무늬). */
    .ov[data-st="pause"] .now, .ov[data-st="idle"] .now { color: #b4b4be; }
    .ov[data-st="ad"] .chip { background: rgb(245, 158, 11); color: #1a1206; }
    .ov[data-st="ad"] .bar i { background: repeating-linear-gradient(-45deg, #f59e0b 0 0.6em, #b77306 0.6em 1.2em); }
    .ov[data-st="pause"] .bar i, .ov[data-st="idle"] .bar i { background: rgb(180, 180, 190); }

    /* corner — 코너 카드(기본): 소스 480×200(광고·회차 끝·시작 전의 밑 한 줄까지), 카드 폭 440, 두 줄 + 아래 진행 막대 */
    .v-corner-card { width: 440rem; padding: 18rem 24rem 24rem; border-radius: 14rem; display: flex; flex-direction: column; gap: 8rem; overflow: hidden; font-size: 22rem; }
    .v-corner-card[data-st="pause"] { background: rgba(10, 10, 14, 0.7); }
    .v-corner-card .top { display: flex; align-items: center; gap: 10rem; }
    .v-corner-card .row { display: flex; align-items: baseline; gap: 10rem; }
    .v-corner-card .now { font-size: 56rem; }
    .v-corner-card .dim { font-size: 24rem; }
    .v-corner-card .chip { margin-left: auto; font-size: 18rem; padding: 3rem 12rem; }
    .v-corner-card .note { font-size: 20rem; }
    .v-corner-card .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5rem; }
    /* 한 시간이 넘는 회차(영화 등) — '1:02:05' 가 카드 폭을 넘지 않게 숫자를 줄이고 전체 길이는 뺀다(남은 시간이 맞추기에 더 쓰인다). */
    .v-corner-card.is-long .now { font-size: 48rem; }
    .v-corner-card.is-long .dur { display: none !important; }

    /* bar — 플레이어 바: 소스 1320×120, 띠 1280×88 */
    .v-bar-card { top: 16rem; width: 1280rem; height: 88rem; padding: 0 28rem; border-radius: 16rem; display: flex; align-items: center; gap: 20rem; font-size: 26rem; }
    .v-bar-card .who { display: flex; align-items: center; gap: 10rem; min-width: 0; max-width: 360rem; }
    .v-bar-card .bar { flex: 1; height: 6rem; border-radius: 3rem; min-width: 120rem; }
    .v-bar-card .bar[hidden] { display: block !important; visibility: hidden; } /* 길이를 몰라도 자리는 둔다 — 시각이 왼쪽으로 쏠리지 않게 */
    .v-bar-card .now { font-size: 44rem; }
    .v-bar-card .dim { font-size: 28rem; }
    .v-bar-card .chip { font-size: 20rem; padding: 4rem 13rem; }

    /* clock — 큰 시계(캠 자리 없이): 소스 440×360(밑 한 줄까지), 카드 폭 400 */
    .v-clock-card { width: 400rem; padding: 22rem 26rem; border-radius: 16rem; display: flex; flex-direction: column; gap: 6rem; font-size: 22rem; }
    .v-clock-card .top { display: flex; align-items: center; gap: 10rem; }
    .v-clock-card .now { font-size: 112rem; margin: 6rem 0 4rem; }
    .v-clock-card .foot { display: flex; align-items: center; gap: 14rem; font-size: 24rem; }
    .v-clock-card .chip { margin-left: auto; font-size: 19rem; padding: 4rem 12rem; }
    .v-clock-card .note { font-size: 20rem; }
    .v-clock-card.is-long .now { font-size: 80rem; }

    /* chip — 미니 칩: 소스 360×96(한 시간 넘는 시각까지), 높이 64. 상태 표(재생·멈춤 그림, 광고·끝·대기 글자)는 폭을 잡고 줄바꿈하지 않는다 — 글자가 깨지거나 잘리지 않게. */
    .v-chip-card { top: 16rem; height: 64rem; padding: 0 20rem 0 18rem; border-radius: 12rem; display: inline-flex; align-items: center; gap: 12rem; font-size: 20rem; }
    .v-chip-card .mark { flex: none; min-width: 2.6em; text-align: center; white-space: nowrap; word-break: keep-all; font-weight: 800; color: #3ddc97; }
    .v-chip-card[data-st="pause"] .mark, .v-chip-card[data-st="idle"] .mark, .v-chip-card[data-st="end"] .mark { color: #b4b4be; }
    .v-chip-card[data-st="ad"] .mark { color: #f59e0b; }
    .v-chip-card .now { flex: none; font-size: 44rem; }
    .v-chip-card .ep { flex: none; }

    /* 상태 그림(HP-817) — ‖·● 를 글자 대신 도형으로. 색은 글자색(currentColor)이라 상태 색 규칙을 그대로 따른다. */
    .ic { flex: none; display: block; }
    .ic svg { display: block; width: 100%; height: 100%; }
    .chip .ic { width: 0.72em; height: 0.72em; }
    /* 표시 칸의 최소 폭(2.6em)은 '광고'·'대기' 같은 두 글자가 깨지지 않게 둔 것이다 — 그림일 때는 풀어 그림 양옆이 비지 않게 한다. */
    .v-chip-card .mark.has-ic { min-width: 0; display: inline-flex; justify-content: center; align-items: center; }
    .v-chip-card .mark .ic-pause { width: 0.85em; height: 0.85em; }
    .v-chip-card .mark .ic-play { width: 0.62em; height: 0.62em; }
    /* 글자 획 가운데 맞춤(HP-817) — 옮길 양(--ink, em)은 alignInk 가 이 PC 의 글꼴로 재서 넣는다. */
    .ink { transform: translateY(var(--ink, 0em)); }
    .v-chip-card .mark-t { display: block; } /* 표시 칸 안의 글자는 인라인이라 transform 이 먹지 않는다 — 블록으로 */
  </style>
</head>
<body>
  <!-- 버전마다 카드 하나 — 고른 버전만 보이고 나머지는 늘 감춘다(chooseVersion). 서버 글자가 들어갈 칸은 비워 두고 textContent 로 채운다. -->
  <div class="ov v-corner-card" data-v="corner" hidden>
    <div class="top"><span class="pf"><span class="pf-t ink"></span></span><span class="ttl ink"></span><span class="ep ink"></span><span class="chip"><span class="ic ic-pause" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="3.5" width="4.6" height="17" rx="1.6"/><rect x="14.4" y="3.5" width="4.6" height="17" rx="1.6"/></svg></span><span class="chip-t ink"></span></span></div>
    <div class="row"><span class="now"></span><span class="dim dur"></span><span class="dim rem"></span></div>
    <span class="note"></span>
    <div class="bar"><i></i></div>
  </div>
  <div class="ov v-bar-card" data-v="bar" hidden>
    <div class="who"><span class="pf"><span class="pf-t ink"></span></span><span class="ttl ink"></span><span class="ep ink"></span></div>
    <div class="bar"><i></i></div>
    <span class="now ink" data-ink="0123456789"></span><span class="dim dur ink"></span><span class="dim rem ink" data-ink="0123456789"></span><span class="chip"><span class="ic ic-pause" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="3.5" width="4.6" height="17" rx="1.6"/><rect x="14.4" y="3.5" width="4.6" height="17" rx="1.6"/></svg></span><span class="chip-t ink"></span></span>
  </div>
  <div class="ov v-clock-card" data-v="clock" hidden>
    <div class="top"><span class="pf"><span class="pf-t ink"></span></span><span class="ttl ink"></span></div>
    <span class="ep"></span>
    <span class="now"></span>
    <div class="foot"><span class="dim dur ink"></span><span class="dim rem ink"></span><span class="chip"><span class="ic ic-pause" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="3.5" width="4.6" height="17" rx="1.6"/><rect x="14.4" y="3.5" width="4.6" height="17" rx="1.6"/></svg></span><span class="chip-t ink"></span></span></div>
    <span class="note"></span>
  </div>
  <div class="ov v-chip-card" data-v="chip" hidden>
    <span class="mark"><span class="ic ic-play" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="12"/></svg></span><span class="ic ic-pause" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="3.5" width="4.6" height="17" rx="1.6"/><rect x="14.4" y="3.5" width="4.6" height="17" rx="1.6"/></svg></span><span class="mark-t ink"></span></span>
    <span class="now ink" data-ink="0123456789"></span><span class="dim ep ink" data-ink="E0123456789"></span>
  </div>
  <script>
  (function () {
    'use strict';
    /* overlayView:start */
    // 플랫폼 코드(Replix-be platform.code) → 화면 이름. 모르는 코드는 플랫폼 칸을 비운다.
    var PLATFORM_NAMES = { netflix: '넷플릭스', disney_plus: '디즈니+', laftel: '라프텔', tving: '티빙', wavve: '웨이브', youtube: '유튜브' };
    var STATE_TEXT = { PLAYING: '재생 중', PAUSED: '멈춤', AD: '광고 대기', EPISODE_END: '회차 끝', IDLE: '시작 전' };
    // 카드에 쓰는 상태 이름(data-st)·칩 글자·미니 칩 표. 재생 중에는 칩을 띄우지 않는다(평소엔 조용하게 — 시안).
    var STATE_KEY = { PLAYING: 'play', PAUSED: 'pause', AD: 'ad', EPISODE_END: 'end', IDLE: 'idle' };
    // 멈춤·재생 중의 표시는 글자가 아니라 그림이다(HP-817 — MARK_ICON, 칩의 멈춤 그림은 st 가 pause 일 때).
    var CHIP_TEXT = { PAUSED: '멈춤', AD: '광고 대기', EPISODE_END: '회차 끝', IDLE: '시작 전' };
    var MARK_TEXT = { AD: '광고', EPISODE_END: '끝', IDLE: '대기' };
    var MARK_ICON = { PLAYING: 'play', PAUSED: 'pause' };
    // 버전과 권장 소스 크기(px) — 페이지 CSS 의 html.v-* 글자 크기와 같은 값이어야 한다(시험이 대조한다). 익스텐션 방 관리가 같은 표를 안내한다.
    var VERSIONS = ['corner', 'bar', 'clock', 'chip'];
    var VERSION_SOURCE = { corner: [480, 200], bar: [1320, 120], clock: [440, 360], chip: [360, 96] };
    function chooseVersion(v) { return VERSIONS.indexOf(v) >= 0 ? v : 'corner'; }
    // 회차 표기 — 익스텐션 replix-net.js formatEpisodeLabel 의 사본(초대 페이지와 같다). 시즌은 2 이상일 때만 붙인다. key 에만 쓴다.
    function formatEpisodeLabel(seasonNumber, episodeNumber) {
      if (typeof episodeNumber !== 'number') return '';
      var season = typeof seasonNumber === 'number' && seasonNumber > 1 ? '시즌' + seasonNumber + ' ' : '';
      return season + episodeNumber + '화';
    }
    // 카드의 짧은 회차 표기(시안) — 'S1 E3', 시즌을 모르면 'E3', 영화는 ''. 칸 사이는 공백(화면 글자에 중간점을 쓰지 않는다).
    function episodeCode(seasonNumber, episodeNumber) {
      if (typeof episodeNumber !== 'number') return '';
      return (typeof seasonNumber === 'number' && seasonNumber > 0 ? 'S' + seasonNumber + ' ' : '') + 'E' + episodeNumber;
    }
    // 초 → '12:26' · 한 시간이 넘으면 '1:02:05'. 소수는 버린다(넷플릭스 플레이어 표시와 같다).
    function formatClock(sec) {
      if (typeof sec !== 'number' || !isFinite(sec)) return '';
      var s = Math.max(0, Math.floor(sec));
      var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      var mm = h > 0 && m < 10 ? '0' + m : String(m);
      return (h > 0 ? h + ':' : '') + mm + ':' + (r < 10 ? '0' + r : r);
    }
    // data = stream-overlay 응답, elapsedSec = 받은 뒤 흐른 초. 그릴 것이 없으면 null(감춘다). pos 는 지금 위치(초, 재생 전이면 null),
    // key 는 같은 흐름(플랫폼·작품·회차·상태)인지 가르는 값이다(steadyPosition).
    function overlayView(data, elapsedSec) {
      if (!data || typeof data.contentTitle !== 'string' || !data.contentTitle.trim()) return null;
      var label = formatEpisodeLabel(data.seasonNumber, data.episodeNumber);
      var pos = typeof data.positionSec === 'number' ? data.positionSec : null;
      if (pos !== null && data.state === 'PLAYING') {
        pos += Math.max(0, elapsedSec || 0) * (typeof data.rate === 'number' && data.rate > 0 ? data.rate : 1);
      }
      var work = data.contentTitle.trim();
      var title = work + (label ? ' ' + label : '');
      return {
        platform: PLATFORM_NAMES[data.platform] || '',
        title: title,
        time: pos === null ? '' : formatClock(pos),
        state: STATE_TEXT[data.state] || '',
        wait: data.state === 'AD',
        work: work,
        ep: episodeCode(data.seasonNumber, data.episodeNumber),
        epShort: typeof data.episodeNumber === 'number' ? 'E' + data.episodeNumber : '',
        st: STATE_KEY[data.state] || 'play',
        chip: CHIP_TEXT[data.state] || '',
        mark: MARK_TEXT[data.state] || '',
        markIcon: MARK_ICON[data.state] || '',
        pos: pos,
        duration: typeof data.durationSec === 'number' && isFinite(data.durationSec) && data.durationSec > 0 ? data.durationSec : null,
        ended: data.state === 'EPISODE_END',
        idle: data.state === 'IDLE',
        key: (data.platform || '') + '|' + title + '|' + (data.state || ''),
      };
    }
    // 남은 시간 '-55:08' — 회차 길이를 알 때만. 둘 다 내린 초로 센다(내림(길이) − 내림(위치)): 시각과 남은 시간이 같은 순간에 한 칸씩 움직이고
    // 둘을 더하면 늘 내림(길이)이다.
    function formatRemain(duration, pos) {
      if (typeof duration !== 'number' || !isFinite(duration) || typeof pos !== 'number' || !isFinite(pos)) return '';
      var left = formatClock(Math.max(0, Math.floor(duration) - Math.floor(pos)));
      return left ? '-' + left : '';
    }
    // 진행 막대(0~100) — 길이를 알 때만(모르면 null = 감춘다). 회차 끝은 가득, 시작 전은 0.
    function progressPct(duration, pos, ended, idle) {
      if (typeof duration !== 'number' || !isFinite(duration) || duration <= 0) return null;
      if (ended) return 100;
      if (idle || typeof pos !== 'number' || !isFinite(pos)) return 0;
      return Math.max(0, Math.min(100, pos / duration * 100));
    }
    // 카드 밑 한 줄(코너 카드·큰 시계) — 재생·멈춤에는 없다. 광고 대기는 이어질 자리를, 회차 끝·시작 전은 기다리는 까닭을 말한다.
    function noteFor(view, time) {
      if (view.wait) return time ? '광고가 끝나면 ' + time + '부터 이어져요' : '광고가 끝나면 이어져요';
      if (view.ended) return '다음 회차를 기다리는 중';
      if (view.idle) return '방장이 재생하면 시작돼요';
      return '';
    }
    // 그릴 시각 두 개 — 뒤로 가지 않는 위치(steadyPosition)와 그 위치로 센 남은 시간. 회차 끝에서는 남은 시간을 빼고('-0:00'이 상태와 겹친다),
    // 뒤로 가지 않는 위치를 다음 판정에 넘긴다.
    function timesFor(view, prevPos, prevKey) {
      var pos = steadyPosition(prevPos, prevKey, view.pos, view.key);
      return { pos: pos, time: pos === null ? '' : formatClock(pos), remain: view.ended ? '' : formatRemain(view.duration, pos) };
    }
    // 재생 중 표시를 뒤로 돌리지 않는다 — 새 응답으로 다시 맞춘 위치가 방금 보인 값보다 조금(1.5초 미만) 뒤면 보인 값을 둔다(방장 표본·
    // 전송 지연의 흔들림으로 12:30 → 12:29 → 12:30 처럼 튀지 않게). 크게 뒤로 갔으면(방장이 되감음) 그대로 따르고, 흐름이 바뀌면(회차·상태)
    // 견주지 않는다.
    var BACKSTEP_TOLERANCE_SEC = 1.5;
    function steadyPosition(prevPos, prevKey, pos, key) {
      if (prevPos === null || pos === null || prevKey !== key) return pos;
      return pos < prevPos && prevPos - pos < BACKSTEP_TOLERANCE_SEC ? prevPos : pos;
    }
    // 글자 획 가운데 맞춤(HP-817) — 요소 상자의 중심과 글자 획의 중심이 얼마나 떨어졌는지(em, 양수면 아래로 옮긴다). align-items: center 는
    // 획이 아니라 글꼴의 줄 상자를 맞추는데, 숫자는 아래로 내려가는 획이 없어 상자 안에서 위로 치우친다. boxTop·boxHeight = 요소 상자,
    // contentTop = 글자 영역 윗변(Range 의 첫 사각형), m = canvas measureText(견본) 결과, fontPx = 글자 크기.
    function inkShiftEm(boxTop, boxHeight, contentTop, m, fontPx) {
      if (!m || !(fontPx > 0) || !(boxHeight > 0)) return 0;
      var inkMid = contentTop + m.fontBoundingBoxAscent - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      var d = (boxTop + boxHeight / 2 - inkMid) / fontPx;
      return isFinite(d) ? Math.round(d * 10000) / 10000 : 0;
    }
    // 해시에서 토큰·버전·환경을 읽는다(#t=…&v=bar&env=dev).
    function readHash(hash) {
      var p = new URLSearchParams(String(hash || '').replace(/^#/, ''));
      return { token: p.get('t') || '', env: p.get('env') || '', v: chooseVersion(p.get('v') || '') };
    }
    function apiBase(metaBase, env) {
      return env === 'dev' ? 'https://api.replix-dev.site' : metaBase;
    }
    /* overlayView:end */

    var POLL_MS = 2000, CLOSED_POLL_MS = 5000, TICK_MS = 250, STALE_MS = 30000, TIMEOUT_MS = 5000;
    var meta = document.querySelector('meta[name="api-base"]');
    var metaBase = meta ? meta.content : 'https://api.replix.tv';
    var hash = readHash(location.hash);
    var cards = {};
    Array.prototype.forEach.call(document.querySelectorAll('.ov[data-v]'), function (el) { cards[el.getAttribute('data-v')] = el; });
    var box = null, parts = null, baseClass = '';
    var last = null, receivedAt = 0;
    var shownPos = null, shownKey = null, painted = [];

    // 고른 버전의 카드만 쓴다 — 다른 카드는 늘 감춘 채 둔다. 글자 크기 기준(html.v-*)도 그 버전으로.
    function useVersion(v) {
      document.documentElement.className = 'v-' + v;
      if (box) box.hidden = true;
      box = cards[v];
      baseClass = box.className.replace(/ is-long/g, '');
      var q = function (sel) { return box.querySelector(sel); };
      parts = { pf: q('.pf'), pfT: q('.pf-t'), ttl: q('.ttl'), ep: q('.ep'), chip: q('.chip'), chipT: q('.chip-t'), chipIc: q('.chip .ic-pause'),
        mark: q('.mark'), markT: q('.mark-t'), mkPlay: q('.mark .ic-play'), mkPause: q('.mark .ic-pause'), now: q('.now'),
        dur: q('.dur'), rem: q('.rem'), note: q('.note'), bar: q('.bar') };
      painted = [];
    }
    // 바뀐 칸만 쓴다 — 0.25초마다 도는데 멈춤·광고처럼 그대로인 동안 방송 PC 에서 스타일 계산이 쉬게. 없는 칸(버전마다 다르다)은 건너뛴다.
    function paint(el, prop, value) {
      if (!el) return;
      for (var i = 0; i < painted.length; i++) {
        if (painted[i][0] === el && painted[i][1] === prop) {
          if (painted[i][2] === value) return;
          painted[i][2] = value; el[prop] = value; return;
        }
      }
      painted.push([el, prop, value]);
      el[prop] = value;
    }
    function paintText(el, text) { paint(el, 'textContent', text); paint(el, 'hidden', !text); }
    function render() {
      var now = performance.now();
      var view = last && now - receivedAt <= STALE_MS ? overlayView(last, (now - receivedAt) / 1000) : null;
      if (!view) { shownPos = null; shownKey = null; paint(box, 'hidden', true); return; }
      var times = timesFor(view, shownPos, shownKey);
      shownPos = times.pos; shownKey = view.key;
      var time = times.time;
      var dur = view.duration && !view.idle ? '/ ' + formatClock(view.duration) : '';
      var pct = progressPct(view.duration, times.pos, view.ended, view.idle);
      // 한 시간이 넘으면 숫자를 줄인다(is-long — 코너 카드·큰 시계가 카드 폭을 넘지 않게)
      var long = time.length > 5 || (view.duration !== null && view.duration >= 3600);
      paint(box, 'className', baseClass + (long ? ' is-long' : ''));
      if (box.getAttribute('data-st') !== view.st) box.setAttribute('data-st', view.st);
      paint(parts.pf, 'hidden', !view.platform);
      paintText(parts.pfT, view.platform);
      paintText(parts.ttl, view.work);
      paintText(parts.ep, box === cards.chip ? view.epShort : view.ep);
      paint(parts.chip, 'hidden', !view.chip);
      paint(parts.chipT, 'textContent', view.chip);
      paint(parts.chipIc, 'hidden', view.st !== 'pause');
      if (parts.mark) {
        paint(parts.mark, 'className', 'mark' + (view.markIcon ? ' has-ic' : ''));
        paint(parts.mkPlay, 'hidden', view.markIcon !== 'play');
        paint(parts.mkPause, 'hidden', view.markIcon !== 'pause');
        paintText(parts.markT, view.mark);
      }
      paint(parts.now, 'textContent', time || '--:--');
      paintText(parts.dur, box === cards.clock && dur ? '전체 ' + dur.slice(2) : dur);
      paintText(parts.rem, box === cards.clock && times.remain ? '남은 ' + times.remain : times.remain);
      paintText(parts.note, noteFor(view, time));
      if (parts.bar) {
        paint(parts.bar, 'hidden', pct === null);
        if (pct !== null) parts.bar.firstElementChild.style.setProperty('--p', pct.toFixed(2) + '%');
      }
      paint(box, 'hidden', false);
      alignInk();
    }

    // 글자 획 가운데 맞춤(HP-817) — .ink 칸마다 이 PC 의 글꼴로 획을 재서 --ink(em)를 넣는다. 다시 재는 것은 그 칸의 견본·글꼴이 바뀔 때뿐이다.
    // 초마다 바뀌는 시각·회차는 고정 견본(data-ink — 숫자 전부)으로 잰다: 숫자마다 획 끝이 조금씩 달라 초마다 들썩이지 않게. em 이라 OBS 에서
    // 소스 크기를 바꿔도 다시 잴 필요가 없다. 보이는 칸만 잰다(감춘 칸은 상자가 없다).
    var inkCtx = null, fontGen = 0;
    function alignInk() {
      var els = box.querySelectorAll('.ink');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.hidden || !el.firstChild) continue;
        var sample = el.getAttribute('data-ink') || el.textContent;
        var cs = getComputedStyle(el);
        var key = fontGen + '|' + cs.fontWeight + '|' + cs.fontFamily + '|' + sample;
        if (el.getAttribute('data-ink-key') === key) continue;
        el.style.setProperty('--ink', '0em');
        if (!inkCtx) inkCtx = document.createElement('canvas').getContext('2d');
        inkCtx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
        var range = document.createRange();
        range.selectNodeContents(el);
        var first = range.getClientRects()[0], rect = el.getBoundingClientRect();
        if (!first || !rect.height) continue;
        el.style.setProperty('--ink', inkShiftEm(rect.top, rect.height, first.top, inkCtx.measureText(sample), parseFloat(cs.fontSize)) + 'em');
        el.setAttribute('data-ink-key', key);
      }
    }
    // 글꼴을 늦게 받으면(대신 쓰인 글꼴로 잰 값이 남지 않게) 다시 잰다.
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function () { fontGen++; render(); });

    // 공개 GET 이라 쿠키·인증을 싣지 않는다. 다음 묻기까지의 간격을 돌려준다. 답이 오는 사이 링크(해시)가 바뀌었으면 옛 토큰의 답은 버린다.
    var inflight = null;
    function ask(token) {
      if (!token) { last = null; return Promise.resolve(CLOSED_POLL_MS); }
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      inflight = ctrl;
      var timeout = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS) : null;
      var sentAt = performance.now();
      var url = apiBase(metaBase, hash.env) + '/api/v1/rooms/stream-overlay?t=' + encodeURIComponent(token);
      return fetch(url, { cache: 'no-store', credentials: 'omit', signal: ctrl ? ctrl.signal : undefined })
        .then(function (res) {
          if (token !== hash.token) return POLL_MS;
          if (res.status === 404) { last = null; return CLOSED_POLL_MS; }
          if (!res.ok) return POLL_MS; // 잠깐의 서버 오류 — 마지막 값을 두고 다시 묻는다(30초가 지나면 감춘다)
          return res.json().then(function (data) {
            if (token !== hash.token) return POLL_MS;
            // 서버는 응답을 만든 순간의 위치를 싣는다 — 그 순간을 보낸 때와 받은 때의 가운데로 잡는다(오는 데 걸린 시간만큼 늦게 보이지 않게).
            last = data;
            receivedAt = (sentAt + performance.now()) / 2;
            return POLL_MS;
          });
        })
        .catch(function () { return POLL_MS; })
        .then(function (next) {
          if (timeout) clearTimeout(timeout);
          if (inflight === ctrl) inflight = null;
          render();
          return next;
        });
    }

    // 묻기 고리 — 해시가 바뀌면 새 고리를 바로 시작하고 옛 고리는 다음 차례를 잡지 않는다(gen).
    var gen = 0, timer = null;
    function loop() {
      var mine = ++gen;
      ask(hash.token).then(function (next) { if (mine === gen) timer = setTimeout(loop, next); });
    }
    window.addEventListener('hashchange', function () {
      var before = hash;
      hash = readHash(location.hash);
      if (hash.v !== before.v) { useVersion(hash.v); shownPos = null; shownKey = null; }
      if (hash.token === before.token && hash.env === before.env) { render(); return; } // 버전만 바뀌었다 — 받은 값으로 바로 다시 그린다
      last = null;
      render();
      if (inflight) inflight.abort(); // 옛 토큰의 요청을 거둔다
      clearTimeout(timer);
      loop(); // 바로 다시 묻는다 — 토큰이 막 붙었으면 5초를 기다리지 않게
    });
    useVersion(hash.v);
    setInterval(render, TICK_MS);
    loop();
  })();
  </script>
</body>
</html>
