<!doctype html>
<!-- 방송 화면 오버레이(HP-757) — https://replix.tv/overlay#t=<오버레이 토큰>[&env=dev]
     역할: 그룹방 스트리밍 모드의 방송인이 OBS 브라우저 소스로 띄운다. 익스텐션 없이 방송만 따라 보는 시청자도 방장 위치를 알게,
     보는 플랫폼·작품명·회차와 방장 위치·상태를 한 줄로 보여 준다. 방송과 함께 늦게 나가므로 '방송 기준 시각'이 된다.
     · 토큰은 해시(#)로만 받는다 — GitHub Pages 서버·리퍼러로 가지 않는다. 묻는 곳은 우리 API(공개 stream-overlay, Replix-be HP-757)뿐이다.
     · 2초마다 묻고, 그 사이는 받은 위치에 흐른 시간 × 재생 속도를 더해 초를 흘린다. 서버가 응답 시각의 위치를 실어 주므로 방송 PC
       시계가 어긋나도 틀어지지 않는다. 30초 넘게 답을 못 받으면 낡은 값을 띄우지 않게 감춘다.
     · 토큰이 없거나 링크가 꺼졌으면(404 — 꺼짐·다시 만듦·스트리밍 모드 꺼짐·방장 바뀜) 아무것도 그리지 않는다. 방송 화면에 오류 글을
       띄우지 않으려는 것이다. 5초마다 다시 물어 모드를 다시 켜면 돌아온다.
     · 싣는 것은 식별 정보뿐이다(법규 트리거 ⑥ — 회차 제목·포스터·플랫폼 로고 없이 플랫폼은 글자로). 서버 문자열은 textContent 로만 넣는다.
     · env=dev 면 개발 서버(api.replix-dev.site)에 묻는다 — 익스텐션 개발 빌드가 만든 링크다. 다른 값은 받지 않는다(아무 주소나 묻지 않게).
     외부 리소스 0, 계측 없음 — 단일 파일. 검사 = scripts/test-overlay.mjs -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 토큰이 실린 주소가 검색에 잡히지 않게(토큰은 해시라 서버에는 가지 않는다). -->
  <meta name="robots" content="noindex">
  <!-- 오버레이를 묻는 곳 — 운영 BE. 링크에 env=dev 가 있으면 개발 서버를 묻는다. -->
  <meta name="api-base" content="https://api.replix.tv">
  <title>Replix 방송 화면</title>
  <style>
    /* OBS 브라우저 소스는 배경을 투명하게 합성한다 — 페이지 배경을 칠하지 않는다. */
    html, body { margin: 0; background: transparent; }
    body {
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }
    .ovl {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 10px 18px; border-radius: 12px;
      background: rgba(10, 10, 14, 0.84); border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e8e8ec; font-size: 20px; line-height: 1.2; white-space: nowrap;
    }
    .ovl[hidden], .ovl [hidden] { display: none; }
    .pf { font-weight: 800; color: #fff; padding-right: 12px; border-right: 1px solid rgba(255, 255, 255, 0.22); }
    .ttl { font-weight: 700; }
    /* 숫자 폭만 고정한다(tabular-nums) — 초가 바뀔 때 상자가 흔들리지 않게. 고정폭 글꼴은 ':' 앞뒤가 벌어져 쓰지 않는다. */
    .time { font-size: 30px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
    .st { color: #cfcfd6; }
    .st.wait { color: #ffb020; }
  </style>
</head>
<body>
  <div class="ovl" id="ovl" hidden>
    <span class="pf" id="pf"></span>
    <span class="ttl" id="ttl"></span>
    <b class="time" id="time"></b>
    <span class="st" id="st"></span>
  </div>
  <script>
  (function () {
    'use strict';
    /* overlayView:start */
    // 플랫폼 코드(Replix-be platform.code) → 화면 이름. 모르는 코드는 플랫폼 칸을 비운다.
    var PLATFORM_NAMES = { netflix: '넷플릭스', disney_plus: '디즈니+', laftel: '라프텔', tving: '티빙', wavve: '웨이브', youtube: '유튜브' };
    var STATE_TEXT = { PLAYING: '재생 중', PAUSED: '멈춤', AD: '광고 대기', EPISODE_END: '회차 끝', IDLE: '시작 전' };
    // 회차 표기 — 익스텐션 replix-net.js formatEpisodeLabel 의 사본(초대 페이지와 같다). 시즌은 2 이상일 때만 붙인다.
    function formatEpisodeLabel(seasonNumber, episodeNumber) {
      if (typeof episodeNumber !== 'number') return '';
      var season = typeof seasonNumber === 'number' && seasonNumber > 1 ? '시즌' + seasonNumber + ' ' : '';
      return season + episodeNumber + '화';
    }
    // 초 → '12:26' · 한 시간이 넘으면 '1:02:05'. 소수는 버린다(넷플릭스 플레이어 표시와 같다).
    function formatClock(sec) {
      if (typeof sec !== 'number' || !isFinite(sec)) return '';
      var s = Math.max(0, Math.floor(sec));
      var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      var mm = h > 0 && m < 10 ? '0' + m : String(m);
      return (h > 0 ? h + ':' : '') + mm + ':' + (r < 10 ? '0' + r : r);
    }
    // data = stream-overlay 응답, elapsedSec = 받은 뒤 흐른 초. 그릴 것이 없으면 null(감춘다). pos 는 지금 위치(초, 재생 전이면 null),
    // key 는 같은 흐름(플랫폼·작품·회차·상태)인지 가르는 값이다(steadyPosition).
    function overlayView(data, elapsedSec) {
      if (!data || typeof data.contentTitle !== 'string' || !data.contentTitle.trim()) return null;
      var label = formatEpisodeLabel(data.seasonNumber, data.episodeNumber);
      var pos = typeof data.positionSec === 'number' ? data.positionSec : null;
      if (pos !== null && data.state === 'PLAYING') {
        pos += Math.max(0, elapsedSec || 0) * (typeof data.rate === 'number' && data.rate > 0 ? data.rate : 1);
      }
      var title = data.contentTitle.trim() + (label ? ' ' + label : '');
      return {
        platform: PLATFORM_NAMES[data.platform] || '',
        title: title,
        time: pos === null ? '' : formatClock(pos),
        state: STATE_TEXT[data.state] || '',
        wait: data.state === 'AD',
        pos: pos,
        key: (data.platform || '') + '|' + title + '|' + (data.state || ''),
      };
    }
    // 재생 중 표시를 뒤로 돌리지 않는다 — 새 응답으로 다시 맞춘 위치가 방금 보인 값보다 조금(1.5초 미만) 뒤면 보인 값을 둔다(방장 표본·
    // 전송 지연의 흔들림으로 12:30 → 12:29 → 12:30 처럼 튀지 않게). 크게 뒤로 갔으면(방장이 되감음) 그대로 따르고, 흐름이 바뀌면(회차·상태)
    // 견주지 않는다.
    var BACKSTEP_TOLERANCE_SEC = 1.5;
    function steadyPosition(prevPos, prevKey, pos, key) {
      if (prevPos === null || pos === null || prevKey !== key) return pos;
      return pos < prevPos && prevPos - pos < BACKSTEP_TOLERANCE_SEC ? prevPos : pos;
    }
    // 해시에서 토큰과 환경을 읽는다(#t=…&env=dev).
    function readHash(hash) {
      var p = new URLSearchParams(String(hash || '').replace(/^#/, ''));
      return { token: p.get('t') || '', env: p.get('env') || '' };
    }
    function apiBase(metaBase, env) {
      return env === 'dev' ? 'https://api.replix-dev.site' : metaBase;
    }
    /* overlayView:end */

    var POLL_MS = 2000, CLOSED_POLL_MS = 5000, TICK_MS = 250, STALE_MS = 30000, TIMEOUT_MS = 5000;
    var meta = document.querySelector('meta[name="api-base"]');
    var metaBase = meta ? meta.content : 'https://api.replix.tv';
    var hash = readHash(location.hash);
    var box = document.getElementById('ovl');
    var pfEl = document.getElementById('pf'), ttlEl = document.getElementById('ttl');
    var timeEl = document.getElementById('time'), stEl = document.getElementById('st');
    var last = null, receivedAt = 0;
    var shownPos = null, shownKey = null, painted = {};

    // 바뀐 칸만 쓴다 — 0.25초마다 도는데 멈춤·광고처럼 그대로인 동안 방송 PC 에서 스타일 계산이 쉬게.
    function paint(el, prop, value) {
      var k = el.id + '.' + prop;
      if (painted[k] === value) return;
      painted[k] = value;
      el[prop] = value;
    }
    function render() {
      var now = performance.now();
      var view = last && now - receivedAt <= STALE_MS ? overlayView(last, (now - receivedAt) / 1000) : null;
      if (!view) { shownPos = null; shownKey = null; paint(box, 'hidden', true); return; }
      var pos = steadyPosition(shownPos, shownKey, view.pos, view.key);
      shownPos = pos; shownKey = view.key;
      var time = pos === null ? '' : formatClock(pos);
      paint(pfEl, 'textContent', view.platform);
      paint(pfEl, 'hidden', !view.platform);
      paint(ttlEl, 'textContent', view.title);
      paint(timeEl, 'textContent', time);
      paint(timeEl, 'hidden', !time);
      paint(stEl, 'textContent', view.state);
      paint(stEl, 'className', view.wait ? 'st wait' : 'st');
      paint(box, 'hidden', false);
    }

    // 공개 GET 이라 쿠키·인증을 싣지 않는다. 다음 묻기까지의 간격을 돌려준다. 답이 오는 사이 링크(해시)가 바뀌었으면 옛 토큰의 답은 버린다.
    var inflight = null;
    function ask(token) {
      if (!token) { last = null; return Promise.resolve(CLOSED_POLL_MS); }
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      inflight = ctrl;
      var timeout = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS) : null;
      var sentAt = performance.now();
      var url = apiBase(metaBase, hash.env) + '/api/v1/rooms/stream-overlay?t=' + encodeURIComponent(token);
      return fetch(url, { cache: 'no-store', credentials: 'omit', signal: ctrl ? ctrl.signal : undefined })
        .then(function (res) {
          if (token !== hash.token) return POLL_MS;
          if (res.status === 404) { last = null; return CLOSED_POLL_MS; }
          if (!res.ok) return POLL_MS; // 잠깐의 서버 오류 — 마지막 값을 두고 다시 묻는다(30초가 지나면 감춘다)
          return res.json().then(function (data) {
            if (token !== hash.token) return POLL_MS;
            // 서버는 응답을 만든 순간의 위치를 싣는다 — 그 순간을 보낸 때와 받은 때의 가운데로 잡는다(오는 데 걸린 시간만큼 늦게 보이지 않게).
            last = data;
            receivedAt = (sentAt + performance.now()) / 2;
            return POLL_MS;
          });
        })
        .catch(function () { return POLL_MS; })
        .then(function (next) {
          if (timeout) clearTimeout(timeout);
          if (inflight === ctrl) inflight = null;
          render();
          return next;
        });
    }

    // 묻기 고리 — 해시가 바뀌면 새 고리를 바로 시작하고 옛 고리는 다음 차례를 잡지 않는다(gen).
    var gen = 0, timer = null;
    function loop() {
      var mine = ++gen;
      ask(hash.token).then(function (next) { if (mine === gen) timer = setTimeout(loop, next); });
    }
    window.addEventListener('hashchange', function () {
      hash = readHash(location.hash);
      last = null;
      render();
      if (inflight) inflight.abort(); // 옛 토큰의 요청을 거둔다
      clearTimeout(timer);
      loop(); // 바로 다시 묻는다 — 토큰이 막 붙었으면 5초를 기다리지 않게
    });
    setInterval(render, TICK_MS);
    loop();
  })();
  </script>
</body>
</html>
